# ──────────────────────────────────────────────────────────────
# sdCloud — Local Development Docker Compose
#
# Поднимает полный стек локально: PostgreSQL + Redis + backend + frontend.
# Используются случайные high-range host-порты, чтобы не конфликтовать с
# другими проектами на машине разработчика:
#   PostgreSQL : 58749  (внутри контейнера 5432)
#   Redis      : 59293  (внутри контейнера 6379)
#   Backend    : 54101  (внутри и снаружи контейнера)
#   Frontend   : 56555  (внутри и снаружи контейнера)
#
# Запуск:
#   docker compose -f docker-compose.local.yaml --env-file backend/.env up -d --build
#
# После запуска:
#   Frontend: http://localhost:56555
#   Backend : http://localhost:54101
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sdcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdcloud
      POSTGRES_PASSWORD: sdcloud
      POSTGRES_DB: sdcloud
    ports:
      - "127.0.0.1:58749:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdcloud -d sdcloud"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sdcloud-network

  # ── Redis Cache & Message Broker ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sdcloud-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:59293:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sdcloud-network

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PORT: 54101
    container_name: sdcloud-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:54101:54101"
    environment:
      # App
      APP_NAME: sdCloud
      APP_VERSION: 1.0.0
      DEBUG: "true"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 54101
      # Database
      DATABASE_URL: postgresql+asyncpg://sdcloud:sdcloud@postgres:5432/sdcloud
      # Redis
      REDIS_URL: redis://redis:6379/1
      # CORS
      FRONTEND_URL: http://localhost:56555
      CORS_ORIGINS: http://localhost:56555,http://localhost:5173
      # OpenRouter секреты берутся из backend/.env
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdcloud-network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 54101 --reload
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:54101/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Браузер ходит на backend через опубликованный host-порт.
        NEXT_PUBLIC_API_URL: http://localhost:54101
        PORT: 56555
    container_name: sdcloud-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:56555:56555"
    environment:
      # Для серверных запросов Next.js используем внутреннее имя контейнера.
      API_URL: http://sdcloud-backend:54101
      PORT: 56555
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sdcloud-network

volumes:
  postgres_data:
  redis_data:

networks:
  sdcloud-network:
    driver: bridge
