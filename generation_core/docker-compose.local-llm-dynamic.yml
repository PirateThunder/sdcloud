# Opt-in two-endpoint setup. Profile VRAM before enabling both servers.
# The RTX 5090 24 GB experiment uses sequential endpoints; see README.md.
x-dynamic-generation-env: &dynamic-generation-env
  LLM_PROVIDER: local
  LLM_DYNAMIC_ROUTING: "1"
  LOCAL_LLM_MODEL: ${VLLM_LARGE_SERVED_NAME:-large}
  LOCAL_LLM_LARGE_MODEL: ${VLLM_LARGE_SERVED_NAME:-large}
  LOCAL_LLM_SMALL_MODEL: ${VLLM_SMALL_SERVED_NAME:-small}
  LOCAL_LLM_LARGE_BASE_URL: http://vllm-large:8000/v1
  LOCAL_LLM_SMALL_BASE_URL: http://llama-small:8000/v1
  LOCAL_LLM_LARGE_MAX_TOKENS: ${LOCAL_LLM_LARGE_MAX_TOKENS:-4096}
  LOCAL_LLM_SMALL_MAX_TOKENS: ${LOCAL_LLM_SMALL_MAX_TOKENS:-4096}
  LLM_VRAM_NVIDIA_SMI: ${LLM_VRAM_NVIDIA_SMI:-nvidia-smi}
  LLM_LARGE_MIN_FREE_MIB: ${LLM_LARGE_MIN_FREE_MIB:-20000}
  LLM_DYNAMIC_LOCAL_FALLBACK: ${LLM_DYNAMIC_LOCAL_FALLBACK:-1}

x-vllm-common: &vllm-common
  image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.30.0}
  volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  restart: unless-stopped

x-vllm-health: &vllm-health
  test:
    - CMD
    - python3
    - -c
    - import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)
  interval: 15s
  timeout: 10s
  retries: 40
  start_period: ${VLLM_HEALTH_START_PERIOD:-1800s}

services:
  vllm-large:
    <<: *vllm-common
    command: >
      --model ${VLLM_LARGE_MODEL:-QuantTrio/Qwen3-VL-30B-A3B-Instruct-AWQ}
      --served-model-name ${VLLM_LARGE_SERVED_NAME:-large}
      --max-model-len ${VLLM_LARGE_MAX_LEN:-8192}
      --gpu-memory-utilization ${VLLM_LARGE_GPU_MEM:-0.88}
      --enforce-eager
    ports:
      - "127.0.0.1:${VLLM_LARGE_HOST_PORT:-8000}:8000"
    healthcheck: *vllm-health
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  llama-small:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_IMAGE_TAG:-server-cuda}
    command: >
      --model ${LLAMA_SMALL_MODEL:-/root/.cache/huggingface/hub/models--Qwen--Qwen3-8B-GGUF/snapshots/7c41481f57cb95916b40956ab2f0b139b296d974/Qwen3-8B-Q4_K_M.gguf}
      --alias ${VLLM_SMALL_SERVED_NAME:-small}
      --ctx-size ${LLAMA_SMALL_CTX_SIZE:-8192}
      --n-gpu-layers ${LLAMA_SMALL_N_GPU_LAYERS:-99}
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_SMALL_HOST_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: ${VLLM_HEALTH_START_PERIOD:-1800s}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    restart: unless-stopped

  gen-api:
    environment: *dynamic-generation-env
    depends_on:
      vllm-large:
        condition: service_healthy
      llama-small:
        condition: service_healthy

  gen-worker:
    environment: *dynamic-generation-env
    depends_on:
      vllm-large:
        condition: service_healthy
      llama-small:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
