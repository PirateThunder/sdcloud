[project]
name = "sdcloud-generation-core"
version = "0.1.0"
description = "CLI-first system dynamics generation and simulation engine"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx[socks]>=0.28.1",
    "python-multipart>=0.0.22",
    "networkx>=3.2.1",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.15.0",
    "pysd==3.14.3",
    "scipy>=1.15.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".test_tmp", "work", "work_api", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "service"]
