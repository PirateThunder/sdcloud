# ──────────────────────────────────────────────────────────────
# sdCloud — Production Docker Compose
#
# Запускает только backend + frontend. Предполагается, что:
#  • PostgreSQL и Redis подняты отдельно (shared) и доступны
#    в Docker-сети shared_network;
#  • Nginx Proxy Manager (jc21/nginx-proxy-manager) тоже подключён
#    к shared_network и проксирует запросы по именам контейнеров.
#
# Ни один публичный порт здесь не открывается — весь входящий трафик
# идёт через Nginx Proxy Manager.
#
# Внутренние порты контейнеров:
#   Backend  : 54101
#   Frontend : 56555
#
# Пример запуска:
#   docker compose -f docker-compose.yaml --env-file backend/.env up -d --build
# ──────────────────────────────────────────────────────────────

services:
  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PORT: 54101
    container_name: sdcloud-backend
    restart: unless-stopped
    environment:
      # App
      APP_NAME: sdCloud
      APP_VERSION: 1.0.2
      DEBUG: "false"
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 54101
      # CORS
      FRONTEND_URL: ${FRONTEND_URL:-https://sdcloud.piratethunder.space}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sdcloud.piratethunder.space}
      # OpenRouter / прочие секреты берутся из backend/.env
    env_file:
      - ./backend/.env
    networks:
      - shared_network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 54101 --workers 2
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:54101/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Этот URL "запекается" в клиентский бандл на этапе сборки.
        # В production браузер будет ходить напрямую на API-поддомен.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.sdcloud.piratethunder.space}
        PORT: 56555
    container_name: sdcloud-frontend
    restart: unless-stopped
    environment:
      # Для серверных запросов Next.js используем внутреннее имя контейнера.
      API_URL: http://sdcloud-backend:54101
      PORT: 56555
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared_network

networks:
  shared_network:
    external: true
