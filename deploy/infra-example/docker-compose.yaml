# ──────────────────────────────────────────────────────────────
# Пример shared-инфраструктуры (admin / infrastructure)
#
# Этот файл — справочный пример. Запускается на пользователе admin.
#
# Включает:
#   • Nginx Proxy Manager
#   • shared PostgreSQL 16
#   • shared Redis 7
#
# Все сервисы подключены к Docker-сети shared_network.
# К ней же подключаются проектные compose-файлы (sdcloud, project2, ...).
#
# Внешние порты:
#   PostgreSQL: 0.0.0.0:50728 → 5432  (для подключения pgAdmin/DBeaver)
#   Redis:      127.0.0.1:54507 → 6379  (только локально на сервере)
#
# БЕЗОПАСНОСТЬ:
#   • PostgreSQL доступен извне — обязательно используйте сильный пароль
#     и ограничьте доступ файрволом (ufw/iptables) только нужным IP.
#   • Redis привязан к 127.0.0.1, чтобы не торчать наружу.
#   • Панель NPM (порт 81) привязана к 127.0.0.1 — используйте SSH-туннель.
#
# Запуск (от пользователя admin, в директории infra):
#   docker network create shared_network  # если ещё не создана
#   docker compose -f docker-compose.yaml up -d
# ──────────────────────────────────────────────────────────────

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: global_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Admin UI — только через SSH-туннель, не открываем наружу
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - shared_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: change-me-strong-password
      POSTGRES_DB: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Доступ извне для pgAdmin/DBeaver. Ограничьте IP на файрволе!
      - "0.0.0.0:50728:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Только локальный доступ с сервера admin
      - "127.0.0.1:54507:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  npm_data:
  npm_letsencrypt:
  postgres_data:
  redis_data:

networks:
  shared_network:
    external: true
