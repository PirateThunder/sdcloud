# ──────────────────────────────────────────────────────────────
# Shared local infrastructure
#
# Поднимает общие PostgreSQL и Redis для локальной разработки.
# Все проекты (sdcloud, project2, ...) могут использовать эти же контейнеры,
# но работать в изолированных базах / Redis DB.
#
# Сеть shared_network создаётся этим compose-файлом.
# Проекты подключаются к ней как external: true.
#
# Host-порты (случайные high-range):
#   PostgreSQL: 0.0.0.0:50728 → 5432  (для pgAdmin/DBeaver)
#   Redis:      127.0.0.1:54507 → 6379  (только локально)
#
# Подключение из проектов (через shared_network):
#   DATABASE_URL=postgresql+asyncpg://sdcloud:sdcloud@shared-postgres:5432/sdcloud
#   REDIS_URL=redis://shared-redis:6379/1
#
# Запуск (один раз на машине разработчика):
#   docker compose -f deploy/infra-example/docker-compose.local.yaml up -d
# ──────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: change-me-strong-password
      POSTGRES_DB: admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # 0.0.0.0 — чтобы можно было подключиться через pgAdmin с другой машины.
      # На ноутбуке в публичной сети лучше сменить на 127.0.0.1.
      - "0.0.0.0:50728:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Только локальный доступ
      - "127.0.0.1:54507:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  shared_network:
    driver: bridge
