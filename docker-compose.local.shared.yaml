# ──────────────────────────────────────────────────────────────
# sdCloud — Local Development Docker Compose (shared infra)
#
# Запускает только backend + frontend, используя общие PostgreSQL/Redis
# из shared-инфраструктуры (deploy/infra-example/docker-compose.local.yaml).
#
# Предварительно поднимите shared-инфраструктуру:
#   docker compose -f deploy/infra-example/docker-compose.local.yaml up -d
#
# Запуск:
#   docker compose -f docker-compose.local.shared.yaml --env-file backend/.env up -d --build
#
# После запуска:
#   Frontend: http://localhost:56555
#   Backend : http://localhost:54101
# ──────────────────────────────────────────────────────────────

services:
  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PORT: 54101
    container_name: sdcloud-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:54101:54101"
    environment:
      # App
      APP_NAME: sdCloud
      APP_VERSION: 1.0.0
      DEBUG: "true"
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 54101
      # Database — shared local PostgreSQL
      DATABASE_URL: postgresql+asyncpg://sdcloud:sdcloud@shared-postgres:5432/sdcloud
      # Redis — shared local Redis, DB index 1
      REDIS_URL: redis://shared-redis:6379/1
      # CORS
      FRONTEND_URL: http://localhost:56555
      CORS_ORIGINS: http://localhost:56555,http://localhost:5173
      # OpenRouter секреты берутся из backend/.env
    env_file:
      - ./backend/.env
    networks:
      - shared_network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 54101 --reload
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:54101/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:54101
        PORT: 56555
    container_name: sdcloud-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:56555:56555"
    environment:
      API_URL: http://sdcloud-backend:54101
      PORT: 56555
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shared_network

networks:
  shared_network:
    external: true
