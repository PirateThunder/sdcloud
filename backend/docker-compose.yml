# ──────────────────────────────────────────────────────────────
# sdCloud — Full Stack Docker Compose
# Backend + PostgreSQL + Redis
# ──────────────────────────────────────────────────────────────

version: "3.9"

services:
  # ── PostgreSQL Database ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sdcloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdcloud
      POSTGRES_PASSWORD: sdcloud
      POSTGRES_DB: sdcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdcloud -d sdcloud"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sdcloud-network

  # ── Redis Cache & Message Broker ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sdcloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sdcloud-network

  # ── Backend API ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdcloud-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # App
      APP_NAME: sdCloud
      APP_VERSION: 1.0.0
      DEBUG: "false"
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      # Database
      DATABASE_URL: postgresql+asyncpg://sdcloud:sdcloud@postgres:5432/sdcloud
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Security
      SECRET_KEY: ${SECRET_KEY:-super-secret-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # CORS
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      # OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: openrouter/google/gemma-4-31b-it:free
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sdcloud-network
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── (Optional) Taskiq Worker ──────────────────────────────
  # Uncomment to run background workers as a separate service
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: sdcloud-worker
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://sdcloud:sdcloud@postgres:5432/sdcloud
  #     REDIS_URL: redis://redis:6379/0
  #     OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - sdcloud-network
  #   command: >
  #     sh -c "
  #       taskiq worker app.workers.tasks:broker
  #     "

volumes:
  postgres_data:
  redis_data:

networks:
  sdcloud-network:
    driver: bridge
